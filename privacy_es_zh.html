  <h1>隐私政策</h1>
  <p>更新日期：2026-06-30</p>
  <p>Wello Spanish 不要求注册账号，不收集个人数据，不进行广告追踪，也不包含第三方广告或统计 SDK。</p>
  <p>你的生词本、学习进度、设置和打卡记录保存在本机设备中。删除 App 会删除这些本地数据。</p>
  <p>词典和阅读内容随 App 内置，核心学习功能可离线使用。</p>
  <p>App 使用 Apple StoreKit 处理一次性内购，购买与恢复购买由 Apple 完成。我们不会获得你的支付卡号或 Apple ID 密码。</p>
  <p>如有问题，请通过支持页面提供的联系方式联系我们。</p>
