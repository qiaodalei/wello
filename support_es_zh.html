  <p>如果你在使用 Wello Spanish 时遇到查词、发音、内购恢复或学习数据问题，请发送邮件联系我们。</p>

  <h2>常见问题</h2>
  <p><strong>是否需要联网？</strong> 词典和阅读内容离线可用，内购和恢复购买需要连接 App Store。</p>
  <p><strong>如何恢复购买？</strong> 进入“我的 / Profile”，点击“恢复购买 / Restore Purchases”。</p>
  <p><strong>高级版是订阅吗？</strong> 不是。高级版是一次性非消耗型内购。</p>
  <p><strong>学习数据保存在哪里？</strong> 生词本、学习进度、设置和打卡记录都保存在本机设备中。</p>
